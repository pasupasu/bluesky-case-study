[project]
name = "bluesky-case-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel Burr", email = "amythysthamster2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastexcel>=0.21.0",
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
bluesky-case-study = "bluesky_case_study:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
